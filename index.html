<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171124" />
  <title>Friend Dossier</title>
  <link rel="stylesheet" href="style.css?v=5.0.0" />
  <link rel="stylesheet" href="splash.css?v=5.0.0" />
  <link rel="stylesheet" href="editor-polish.css?v=1.1.0" />
</head>
<body>
  <section id="splash" class="splash splash-v2" aria-label="Loading Friend Dossier">
    <div class="splash-ambience" aria-hidden="true">
      <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><span class="spark s4">✧</span><span class="moon">☾</span>
    </div>
    <div class="splash-heading"><h1>Friend<br>Dossier</h1><div class="ornament"><span></span><b>✦</b><span></span></div><p>Summoning your tiny dragon archivist...</p></div>
    <div class="dragon-scene dragon-reading" aria-hidden="true">
      <svg viewBox="0 0 480 560" role="img" aria-label="Dragon reading a book"><defs><linearGradient id="dragonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9caf"/><stop offset=".48" stop-color="#ef5f7d"/><stop offset="1" stop-color="#c03c72"/></linearGradient><linearGradient id="bellyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd1bf"/><stop offset="1" stop-color="#ff9c98"/></linearGradient><linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb8c8"/><stop offset="1" stop-color="#d94e78"/></linearGradient><linearGradient id="bookG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b263f"/><stop offset="1" stop-color="#211524"/></linearGradient><radialGradient id="pageGlow"><stop offset="0" stop-color="#fff3c9"/><stop offset=".55" stop-color="#ffcfa8"/><stop offset="1" stop-color="#ffab9e" stop-opacity="0"/></radialGradient><filter id="softGlow"><feGaussianBlur stdDeviation="12"/></filter></defs><ellipse cx="240" cy="465" rx="175" ry="44" fill="#000" opacity=".16"/><circle cx="240" cy="347" r="105" fill="url(#pageGlow)" opacity=".22" filter="url(#softGlow)"/><path d="M143 205 C72 231 65 343 120 390 C112 313 137 259 187 233 Z" fill="url(#wingG)" stroke="#ff9cb2" stroke-width="5"/><path d="M337 205 C408 231 415 343 360 390 C368 313 343 259 293 233 Z" fill="url(#wingG)" stroke="#ff9cb2" stroke-width="5"/><path d="M146 246 L93 190 L126 283 Z" fill="#e95077"/><path d="M334 246 L387 190 L354 283 Z" fill="#e95077"/><path d="M199 132 C171 83 177 39 198 16 C197 70 210 103 220 129 Z" fill="#ffd4b5" stroke="#ff9b9b" stroke-width="4"/><path d="M281 132 C309 83 303 39 282 16 C283 70 270 103 260 129 Z" fill="#ffd4b5" stroke="#ff9b9b" stroke-width="4"/><path d="M157 175 C163 116 198 91 240 91 C282 91 317 116 323 175 C329 236 295 279 240 279 C185 279 151 236 157 175 Z" fill="url(#dragonG)" stroke="#ff9fb0" stroke-width="5"/><path d="M165 166 L122 141 L146 194 Z" fill="#f56b8b"/><path d="M315 166 L358 141 L334 194 Z" fill="#f56b8b"/><path d="M186 113 L172 83 L201 101 Z" fill="#c83964"/><path d="M218 98 L211 65 L234 93 Z" fill="#c83964"/><path d="M262 98 L269 65 L246 93 Z" fill="#c83964"/><path d="M294 113 L308 83 L279 101 Z" fill="#c83964"/><ellipse cx="207" cy="188" rx="22" ry="29" fill="#331631"/><ellipse cx="273" cy="188" rx="22" ry="29" fill="#331631"/><ellipse cx="211" cy="191" rx="10" ry="17" fill="#b62258"/><ellipse cx="269" cy="191" rx="10" ry="17" fill="#b62258"/><circle cx="216" cy="178" r="7" fill="#fff"/><circle cx="274" cy="178" r="7" fill="#fff"/><path d="M218 228 Q240 244 262 228" fill="none" stroke="#6f264c" stroke-width="5" stroke-linecap="round"/><path d="M226 209 q14 8 28 0" fill="none" stroke="#8a3457" stroke-width="3" stroke-linecap="round"/><path d="M188 264 C168 299 171 353 194 385 L240 399 L286 385 C309 353 312 299 292 264 C275 281 258 291 240 291 C222 291 205 281 188 264 Z" fill="url(#dragonG)"/><path d="M219 283 C211 322 214 354 240 381 C266 354 269 322 261 283 Z" fill="url(#bellyG)" opacity=".92"/><path d="M157 315 q-16 15 -8 38" fill="none" stroke="#ff8da8" stroke-width="15" stroke-linecap="round"/><path d="M323 315 q16 15 8 38" fill="none" stroke="#ff8da8" stroke-width="15" stroke-linecap="round"/><circle cx="149" cy="350" r="8" fill="#ffb4ba"/><circle cx="331" cy="350" r="8" fill="#ffb4ba"/><path d="M101 336 Q176 299 240 344 L240 466 Q179 421 86 443 Z" fill="url(#bookG)" stroke="#efaa9d" stroke-width="5"/><path d="M379 336 Q304 299 240 344 L240 466 Q301 421 394 443 Z" fill="url(#bookG)" stroke="#efaa9d" stroke-width="5"/><path d="M240 344 L240 466" stroke="#eec0a5" stroke-width="5"/><path d="M107 339 Q177 315 230 350" fill="#fff6d4" stroke="#ffd6b4" stroke-width="4"/><path d="M373 339 Q303 315 250 350" fill="#fff6d4" stroke="#ffd6b4" stroke-width="4"/><path d="M121 364 Q176 345 222 367" fill="none" stroke="#d69a89" stroke-width="3" opacity=".75"/><path d="M359 364 Q304 345 258 367" fill="none" stroke="#d69a89" stroke-width="3" opacity=".75"/><path d="M128 382 Q177 365 218 385" fill="none" stroke="#d69a89" stroke-width="3" opacity=".55"/><path d="M352 382 Q303 365 262 385" fill="none" stroke="#d69a89" stroke-width="3" opacity=".55"/><circle cx="240" cy="406" r="10" fill="#ffd98c" opacity=".9"/><path d="M356 394 C420 416 420 478 359 493 C299 508 226 484 166 499 C122 510 111 532 130 549 C91 539 74 505 90 480 C113 445 171 447 223 458 C281 470 343 464 356 431" fill="none" stroke="url(#dragonG)" stroke-width="27" stroke-linecap="round"/><path d="M130 548 l-29 -9 l19 -23" fill="#ee5e7f"/></svg>
    </div>
    <div class="splash-loader-wrap"><div class="loader"><span></span></div><div class="loading-word">L O A D I N G . . .</div></div>
  </section>
  <div id="app" class="app hidden"><header class="home-tools"><input id="searchInput" class="search" type="search" placeholder="Search people" autocomplete="off" /><button id="settingsBtn" class="icon-button" aria-label="Settings">⚙︎</button></header><main><section id="homeView" class="screen"><div id="peopleGrid" class="people-grid"></div><button id="addFriendBtn" class="add-friend-bottom"><span>＋</span> Add friend</button></section><section id="personView" class="screen hidden"><button id="personBackBtn" class="back-link">‹ People</button><div id="personHero" class="person-hero"></div><div id="personChoice" class="choice-panel"><button id="readBtn" class="big-choice"><span>📖</span><strong>Read</strong><small>See their whole dossier</small></button><button id="addInfoBtn" class="big-choice"><span>✚</span><strong>Add info</strong><small>Add one thing quickly</small></button></div><section id="readPanel" class="hidden"></section><section id="addInfoPanel" class="hidden"></section></section></main></div>
  <dialog id="friendDialog" class="modal"><form id="friendForm" class="modal-card"><div class="modal-head"><h2 id="friendDialogTitle">Add friend</h2><button type="button" data-close="friendDialog" class="xbtn">×</button></div><input id="friendId" type="hidden" /><input id="photoData" type="hidden" /><div class="photo-row"><div id="photoPreviewWrap" class="photo-preview"><span>📷</span></div><label class="soft-button">Choose photo<input id="photoInput" type="file" accept="image/*" hidden /></label><button id="removePhotoBtn" type="button" class="text-button">Remove</button></div><label>Name<input id="friendName" required maxlength="80" /></label><label>Relationship / label<input id="friendRelation" maxlength="80" placeholder="Friend, sister, work…" /></label><fieldset class="birthday-box"><legend>Birthday</legend><div class="date-parts"><label>Day<input id="birthdayDay" type="number" min="1" max="31" inputmode="numeric" /></label><label>Month<select id="birthdayMonth"><option value="">Month</option></select></label><label>Year <small>(optional)</small><input id="birthdayYear" type="number" min="1900" max="2100" inputmode="numeric" /></label></div></fieldset><button class="primary-button" type="button">Save friend</button></form></dialog>
  <dialog id="entryDialog" class="modal"><form id="entryForm" method="dialog" class="modal-card"><div class="modal-head"><h2 id="entryDialogTitle">Add info</h2><button type="button" data-close="entryDialog" class="xbtn">×</button></div><input id="entryId" type="hidden" /><input id="entryType" type="hidden" /><div class="emoji-value-row"><label>Emoji<input id="entryEmoji" maxlength="4" placeholder="🎁" /></label><label class="grow">Title <small>(optional)</small><input id="entryTitle" maxlength="80" /></label></div><label id="entryValueLabel">Info<textarea id="entryValue" rows="3" maxlength="800"></textarea></label><fieldset id="entryDateFields" class="birthday-box hidden"><legend>Date</legend><div class="date-parts"><label>Day<input id="entryDay" type="number" min="1" max="31" inputmode="numeric" /></label><label>Month<select id="entryMonth"><option value="">Month</option></select></label><label>Year <small>(optional)</small><input id="entryYear" type="number" min="1900" max="2100" inputmode="numeric" /></label></div></fieldset><button class="primary-button" type="submit">Save</button></form></dialog>
  <dialog id="settingsDialog" class="modal"><form method="dialog" class="modal-card settings-card"><div class="modal-head"><h2>Settings</h2><button type="button" data-close="settingsDialog" class="xbtn">×</button></div><h3>Colours</h3><div class="colour-grid"><label>Background<input id="bgColour" type="color" /></label><label>Accent<input id="accentColour" type="color" /></label><label>Bubble tint<input id="bubbleColour" type="color" /></label></div><h3>Categories</h3><div id="settingsCategories" class="settings-categories"></div><button id="addCategoryBtn" type="button" class="soft-button full">＋ Add category</button><h3>Backup</h3><button id="exportBtn" type="button" class="soft-button full">Export dossier</button><label class="soft-button full center">Import dossier<input id="importInput" type="file" accept="application/json,.json" hidden /></label><button id="saveSettingsBtn" type="button" class="primary-button">Save settings</button></form></dialog>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js?v=5.2.0"></script>
  <script src="emoji-frames.js?v=1.0.0"></script>
  <script>setTimeout(()=>{const s=document.getElementById('splash'),a=document.getElementById('app');if(s&&!s.classList.contains('done')){s.classList.add('done');a?.classList.remove('hidden')}},5000)</script>
</body>
</html>
