<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171124" />
  <title>Friend Dossier</title>
  <link rel="stylesheet" href="style.css?v=3.0.0" />
</head>
<body>
  <section id="splash" class="splash" aria-label="Loading Friend Dossier">
    <div class="splash-stars" aria-hidden="true">✦ · ✧ · ✦ · ✧</div>
    <div class="dragon-scene" aria-hidden="true">
      <svg viewBox="0 0 420 520" role="img" aria-label="Dragon reading a book">
        <defs>
          <linearGradient id="dragonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8cb5"/><stop offset=".55" stop-color="#e75f91"/><stop offset="1" stop-color="#9f4ddd"/></linearGradient>
          <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc8de" stop-opacity=".9"/><stop offset="1" stop-color="#bd85f8" stop-opacity=".62"/></linearGradient>
          <linearGradient id="bookG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#352447"/><stop offset="1" stop-color="#1d1728"/></linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <ellipse cx="210" cy="438" rx="156" ry="37" fill="#c794ff" opacity=".12"/>
        <path d="M120 210 C58 226 52 329 102 365 C96 302 119 267 163 248 Z" fill="url(#wingG)" stroke="#eeb9ff" stroke-width="4"/>
        <path d="M300 210 C362 226 368 329 318 365 C324 302 301 267 257 248 Z" fill="url(#wingG)" stroke="#eeb9ff" stroke-width="4"/>
        <path d="M175 148 C142 91 154 49 172 31 C174 79 188 109 199 137 Z" fill="#ffd8e7" stroke="#ff9cbc" stroke-width="4"/>
        <path d="M245 148 C278 91 266 49 248 31 C246 79 232 109 221 137 Z" fill="#ffd8e7" stroke="#ff9cbc" stroke-width="4"/>
        <path d="M138 189 C142 129 174 104 210 104 C246 104 278 129 282 189 C286 246 255 285 210 285 C165 285 134 246 138 189 Z" fill="url(#dragonG)" stroke="#ffb4d0" stroke-width="4"/>
        <path d="M161 149 L124 126 L145 178 Z" fill="#ff9fc3"/><path d="M259 149 L296 126 L275 178 Z" fill="#ff9fc3"/>
        <ellipse cx="181" cy="190" rx="17" ry="23" fill="#26132f"/><ellipse cx="239" cy="190" rx="17" ry="23" fill="#26132f"/><circle cx="187" cy="182" r="6" fill="#fff"/><circle cx="245" cy="182" r="6" fill="#fff"/>
        <path d="M193 223 Q210 238 227 223" fill="none" stroke="#542045" stroke-width="5" stroke-linecap="round"/>
        <path d="M169 277 C137 319 141 364 179 382 L210 344 L241 382 C279 364 283 319 251 277 C237 293 224 302 210 302 C196 302 183 293 169 277 Z" fill="url(#dragonG)"/>
        <path d="M128 339 C82 363 91 420 153 430 C205 438 265 430 306 451 C338 468 347 493 327 505 C350 500 369 482 365 461 C357 418 293 399 235 407 C173 416 131 402 128 374" fill="none" stroke="url(#dragonG)" stroke-width="23" stroke-linecap="round"/>
        <path d="M87 321 Q155 289 210 329 L210 438 Q154 399 77 417 Z" fill="url(#bookG)" stroke="#f3b3dd" stroke-width="4"/><path d="M333 321 Q265 289 210 329 L210 438 Q266 399 343 417 Z" fill="url(#bookG)" stroke="#f3b3dd" stroke-width="4"/><path d="M210 329 L210 438" stroke="#f8d0ea" stroke-width="4"/>
        <path d="M105 342 Q157 323 196 344" fill="none" stroke="#f0c9e7" opacity=".55" stroke-width="3"/><path d="M315 342 Q263 323 224 344" fill="none" stroke="#f0c9e7" opacity=".55" stroke-width="3"/><circle cx="210" cy="361" r="10" fill="#ffd68e" filter="url(#glow)"/><path d="M158 314 q-12 16 -3 31" fill="none" stroke="#ffb9d5" stroke-width="12" stroke-linecap="round"/><path d="M262 314 q12 16 3 31" fill="none" stroke="#ffb9d5" stroke-width="12" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="splash-copy"><div class="splash-title">Friend Dossier</div><div class="splash-sub">Your dragon archivist is opening the book…</div><div class="loader"><span></span></div></div>
  </section>
  <div id="app" class="app hidden">
    <header class="home-tools"><input id="searchInput" class="search" type="search" placeholder="Search people" autocomplete="off" /><button id="settingsBtn" class="icon-button" aria-label="Settings">⚙︎</button></header>
    <main>
      <section id="homeView" class="screen"><div id="peopleGrid" class="people-grid"></div><button id="addFriendBtn" class="add-friend-bottom"><span>＋</span> Add friend</button></section>
      <section id="personView" class="screen hidden"><button id="personBackBtn" class="back-link">‹ People</button><div id="personHero" class="person-hero"></div><div id="personChoice" class="choice-panel"><button id="readBtn" class="big-choice"><span>📖</span><strong>Read</strong><small>See their whole dossier</small></button><button id="addInfoBtn" class="big-choice"><span>✚</span><strong>Add info</strong><small>Add one thing quickly</small></button></div><section id="readPanel" class="hidden"></section><section id="addInfoPanel" class="hidden"></section></section>
    </main>
  </div>
  <dialog id="friendDialog" class="modal"><form id="friendForm" method="dialog" class="modal-card"><div class="modal-head"><h2 id="friendDialogTitle">Add friend</h2><button type="button" data-close="friendDialog" class="xbtn">×</button></div><input id="friendId" type="hidden" /><input id="photoData" type="hidden" /><div class="photo-row"><div id="photoPreviewWrap" class="photo-preview"><span>📷</span></div><label class="soft-button">Choose photo<input id="photoInput" type="file" accept="image/*" hidden /></label><button id="removePhotoBtn" type="button" class="text-button">Remove</button></div><label>Name<input id="friendName" required maxlength="80" /></label><label>Relationship / label<input id="friendRelation" maxlength="80" placeholder="Friend, sister, work…" /></label><fieldset class="birthday-box"><legend>Birthday</legend><div class="date-parts"><label>Day<input id="birthdayDay" type="number" min="1" max="31" inputmode="numeric" /></label><label>Month<select id="birthdayMonth"><option value="">Month</option></select></label><label>Year <small>(optional)</small><input id="birthdayYear" type="number" min="1900" max="2100" inputmode="numeric" /></label></div></fieldset><button class="primary-button" type="submit">Save friend</button></form></dialog>
  <dialog id="entryDialog" class="modal"><form id="entryForm" method="dialog" class="modal-card"><div class="modal-head"><h2 id="entryDialogTitle">Add info</h2><button type="button" data-close="entryDialog" class="xbtn">×</button></div><input id="entryId" type="hidden" /><input id="entryType" type="hidden" /><div class="emoji-value-row"><label>Emoji<input id="entryEmoji" maxlength="4" placeholder="🎁" /></label><label class="grow">Title <small>(optional)</small><input id="entryTitle" maxlength="80" /></label></div><label id="entryValueLabel">Info<textarea id="entryValue" rows="3" maxlength="800"></textarea></label><fieldset id="entryDateFields" class="birthday-box hidden"><legend>Date</legend><div class="date-parts"><label>Day<input id="entryDay" type="number" min="1" max="31" inputmode="numeric" /></label><label>Month<select id="entryMonth"><option value="">Month</option></select></label><label>Year <small>(optional)</small><input id="entryYear" type="number" min="1900" max="2100" inputmode="numeric" /></label></div></fieldset><button class="primary-button" type="submit">Save</button></form></dialog>
  <dialog id="settingsDialog" class="modal"><form method="dialog" class="modal-card settings-card"><div class="modal-head"><h2>Settings</h2><button type="button" data-close="settingsDialog" class="xbtn">×</button></div><h3>Colours</h3><div class="colour-grid"><label>Background<input id="bgColour" type="color" /></label><label>Accent<input id="accentColour" type="color" /></label><label>Bubble tint<input id="bubbleColour" type="color" /></label></div><h3>Categories</h3><div id="settingsCategories" class="settings-categories"></div><button id="addCategoryBtn" type="button" class="soft-button full">＋ Add category</button><h3>Backup</h3><button id="exportBtn" type="button" class="soft-button full">Export dossier</button><label class="soft-button full center">Import dossier<input id="importInput" type="file" accept="application/json,.json" hidden /></label><button id="saveSettingsBtn" type="button" class="primary-button">Save settings</button></form></dialog>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js?v=3.0.0"></script><script>setTimeout(()=>{const s=document.getElementById('splash'),a=document.getElementById('app');if(s&&!s.classList.contains('done')){s.classList.add('done');a?.classList.remove('hidden')}},5000)</script>
</body>
</html>
